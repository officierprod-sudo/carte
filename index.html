<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Carte de Visite - Glodi Apple</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <!-- Une seule carte unique et ultra professionnelle -->
    <div class="business-card">
        
        <!-- Côté Gauche : Vos Informations -->
        <div class="card-left">
            <div class="brand">
                <h2>GLODI APPLE</h2>
                <p class="subtitle">Mr Apple / Businessman</p>
            </div>
            <div class="info-details">
                <p><i class="fa-solid fa-phone"></i> +243 842 010 585</p>
                <p><i class="fa-solid fa-location-dot"></i> Kongo Central, Boma, RDC</p>
            </div>
        </div>

        <!-- Côté Droite : Votre Scanner (Zone du rond vert) -->
        <div class="card-right">
            <p class="scan-text">ANALYSE-MOI</p>
            <div class="qr-code-zone">
                <!-- IMPORTANT : Votre fichier doit s'appeler taplink.svg ou mon-qrcode.png -->
                <img src="mon-qrcode.png.svg" alt="Scanner Glodi Apple">
            </div>
        </div>

    </div>

</body>
</html>
